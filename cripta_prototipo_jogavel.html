 {const c=cam();mx=c.x+mx/c.z;my=c.y+my/c.z}

 let dx=0,dy=0;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;

 else if(P.tx!==null){const ax=P.tx-P.x,ay=P.ty-P.y,l=Math.hypot(ax,ay);if(l<4){P.tx=null}else{dx=ax/l;dy=ay/l}}

 const sp=(keys['shift']?230:150);
  const nx=P.x+dx*sp*dt,ny=P.y+dy*sp*dt*.7;

 if(EV.cool>0)EV.cool-=dt;
 if(!EV.done&&ev<EV.r&&EV.cool<=0){EV.done=true;EV.run=3.4;say('Algo se move entre os ossos…')}
 if(EV.run>0){EV.run-=dt;want='ev';tz=1.85;fx=EV.x;fy=EV.y-60;ts=.8}
 else if(dlg){want='dlg';tz=1.9;fx=(P.x+s[0])/2;fy=Math.min(P.y,s[1])-72;ts=.6}
 else if(Math.min(d,da)<(C.why==='npc'?270:200)){want='npc';tz=1.75;fx=(P.x+s[0])/2;fy=Math.min(P.y,s[1])-72;ts=.7}
 else if(Math.min(door,dra)<(C.why==='door'?210:150)){want='door';tz=1.65;fx=(P.x+195)/2;fy=Math.min(P.y,330)-62;ts=.7}
 if(EV.done&&ev>EV.r*2.5&&EV.cool<=0&&!(EV.run>0))EV.done=false,EV.cool=8;
 // tempo mínimo (dwell) antes de voltar ao plano aberto: evita "pumping"
 if(want){if(want!==C.why)C.hold=1.1;C.why=want}
 else if(C.hold>0){C.hold-=dt;tz=C.tz;fx=C.tfx;fy=C.tfy;ts=C.ts}
 else C.why='';
 C.tz=tz;C.tfx=fx;C.tfy=fy;C.ts=ts;
}
function camStep(dt){camTarget(dt);
 const pz=C.z;let r;
 r=sd(C.z,C.tz,C.vz,C.ts,dt);C.z=r[0];C.vz=r[1];
 const vw=W/C.z,vh=H/C.z;
 r=sd(C.fx,C.tfx,C.vx,C.why?C.ts:.38,dt);C.fx=r[0];C.vx=r[1];
 r=sd(C.fy,C.tfy,C.vy,C.why?C.ts:.38,dt);C.fy=r[0];C.vy=r[1];
 C.x=Math.max(0,Math.min(W-vw,C.fx-vw/2));C.y=Math.max(0,Math.min(H-vh,C.fy-vh/2));
 // intensidade do blur = velocidade do zoom, suavizada (sobe e desce em sino, nunca "liga/desliga")
 C.zv=Math.abs(C.z-pz)/Math.max(dt,.001);
 const tb=Math.min(1,C.zv/.9);C.bl+=(tb-C.bl)*(1-Math.exp(-dt*9));
 const bq=Math.round(C.bl*1.1*8)/8;if(bq!==camStep.b){camStep.b=bq;cv.style.filter='sepia(.12) contrast(1.14) saturate(1.12) brightness(.98) blur('+(.35+bq).toFixed(2)+'px)'}}
function cam(){return C}
const prv=document.createElement('canvas');prv.width=W;prv.height=H;const pg=prv.getContext('2d');
// ===== desenho =====
const scl=y=>.88+(Math.max(0,Math.min(1,(y-Wd.minY)/(Wd.maxY-Wd.minY))))*.18;
const sil=document.createElement('canvas');sil.width=sil.height=128;const sg=sil.getContext('2d');
function drawChar(img,fr,fw,x,y,face,s){const w=128*s*.975,h=128*s*.975;g.save();g.translate(x,y);g.scale(face,1);
 // contorno leve em tinta escura (silhueta deslocada 1px em 8 direções)
 sg.clearRect(0,0,128,128);sg.globalCompositeOperation='source-over';sg.drawImage(img,(fr%fw)*128,0,128,128,0,0,128,128);
 sg.globalCompositeOperation='source-in';sg.fillStyle='#0b0907';sg.fillRect(0,0,128,128);
 const o=1.1*s*.975*(128/128);g.globalAlpha=.85;
 for(const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1],[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]])g.drawImage(sil,0,0,128,128,-w/2+ox*o*1.15,-h+oy*o*1.15,w,h);
 g.globalAlpha=1;
 g.drawImage(img,(fr%fw)*128,0,128,128,-w/2,-h,w,h);g.restore();
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y-1,22*s,6*s,0,0,7);g.fill()}
function drawWorld(){
 g.drawImage(IM.latbg,0,0);
 // chamas (pixel, 2x)
 for(const [tx,ty] of Wd.torches){const f=Math.floor(t*9+tx)%6;g.drawImage(IM.fire,f*44,0,44,48,tx-44,ty-48,88,96)}
 const ents=[{y:P.y,d:()=>{drawChar(P.moving?IM.hwalk:IM.hidle,Math.floor(P.fr),P.moving?8:6,P.x,P.y,P.face,scl(P.y))}},
  {y:Wd.sam[1],d:()=>drawChar(IM.sidle,Math.floor(t*6)%6,6,Wd.sam[0],Wd.sam[1],-1,scl(Wd.sam[1]))}];
 ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
 g.drawImage(IM.latfg,0,0);
}
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lg=lc.getContext('2d');
function light(){
 const k=Math.max(0,Math.min(1,(C.z-BZ)/.6)),L=(a,b)=>a+(b-a)*k;
 const a1=[.30,.40,.44],a2=[.09,.12,.14],amb=a1.map((v,i)=>L(v,a2[i]));
 lg.globalCompositeOperation='source-over';lg.fillStyle='rgb('+amb.map(v=>v*255|0)+')';lg.fillRect(0,0,W,H);
 lg.globalCompositeOperation='lighter';
 const tr=(x,y)=>[(x-C.x)*C.z,(y-C.y)*C.z];
 const spot=(x,y,r,a,col)=>{const [sx,sy]=tr(x,y);r*=C.z;const gr=lg.createRadialGradient(sx,sy,2,sx,sy,r);gr.addColorStop(0,'rgba('+col+','+a+')');gr.addColorStop(1,'rgba('+col+',0)');lg.fillStyle=gr;lg.fillRect(sx-r,sy-r,r*2,r*2)};
 const fl=(q)=>1+Math.sin(t*13+q)*.03+Math.sin(t*7.3+q*2)*.04;
 const ev=EV.run>0?(.55+.45*Math.abs(Math.sin(t*22))):1; // tochas tremem no evento
 Wd.torches.forEach(([x,y],i)=>spot(x,y+10,L(270,215)*fl(i)*(EV.run>0?ev:1),L(1.0,.9),'255,150,60'));
 spot(P.x,P.y-40,L(130,230)*fl(9),L(.26,.58),'255,195,125');
lg.globalCompositeOperation='source-over';
 {const fy=(C.y>=0?(Wd.minY-30-C.y)*C.z:0),gr=lg.createLinearGradient(0,fy,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');lg.fillStyle=gr;lg.fillRect(0,Math.max(0,fy),W,H)}
 g.save();g.globalCompositeOperation='multiply';g.drawImage(lc,0,0);g.restore();
}
const nz=document.createElement('canvas');nz.width=240;nz.height=135;const ng=nz.getContext('2d');let nzT=0;
function bloom(){
 const tr=(x,y)=>[(x-C.x)*C.z,(y-C.y)*C.z];g.save();g.globalCompositeOperation='screen';
 Wd.torches.forEach(([x,y],i)=>{const [sx,sy]=tr(x,y-8),r=70*C.z*(1+Math.sin(t*13+i)*.05),gr=g.createRadialGradient(sx,sy,0,sx,sy,r);
  gr.addColorStop(0,'rgba(255,170,70,.42)');gr.addColorStop(.35,'rgba(255,120,40,.16)');gr.addColorStop(1,'rgba(255,100,30,0)');g.fillStyle=gr;g.fillRect(sx-r,sy-r,r*2,r*2)});
 g.restore()}
function filmFx(){
 if(t-nzT>.08){nzT=t;const d=ng.createImageData(240,135);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}ng.putImageData(d,0,0)}
 g.save();g.globalAlpha=.10;g.globalCompositeOperation='overlay';g.imageSmoothingEnabled=true;g.drawImage(nz,0,0,W,H);g.restore();
 g.save();g.globalAlpha=.5;for(let i=0;i<2;i++){if(Math.random()<.5){g.fillStyle='rgba(235,225,200,'+(Math.random()*.25)+')';g.fillRect(Math.random()*W,0,1,H)}}
 for(let i=0;i<5;i++){g.fillStyle='rgba(240,230,200,.5)';g.fillRect(Math.random()*W,Math.random()*H,2,2)}g.restore();
 const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.72)');g.fillStyle=v;g.fillRect(0,0,W,H)}
function ui(){
 // aviso de interação
 if(!dlg)for(const o of things()){if(Math.hypot(P.x-o.x,P.y-o.y)<o.r){const c=C;const sx=(o.x-c.x)*c.z,sy=(o.y-c.y)*c.z-120*c.z;
  g.font='bold 15px Georgia';const tx='[E] '+o.txt;const w=g.measureText(tx).width+18;g.fillStyle='rgba(8,6,5,.85)';g.fillRect(sx-w/2,sy-16,w,26);g.strokeStyle='#b89448';g.strokeRect(sx-w/2+.5,sy-15.5,w-1,25);g.fillStyle='#ecdfb8';g.textAlign='center';g.fillText(tx,sx,sy+3);g.textAlign='left';break}}
 if(dlg){g.fillStyle='rgba(8,6,5,.92)';g.fillRect(90,400,780,110);g.strokeStyle='#b89448';g.lineWidth=3;g.strokeRect(92,402,776,106);
  g.fillStyle='#b89448';g.font='bold 16px Georgia';g.fillText(NPC.name,112,428);g.fillStyle='#ecdfb8';g.font='18px Georgia';
  const s=dlg[dlgI].slice(0,Math.floor(dlgC));wrap(s,112,456,740,24);g.fillStyle='#7a6a40';g.font='12px sans-serif';g.fillText('[E] / clique: continuar',730,498)}
 if(toastT>0){g.font='bold 16px Georgia';g.textAlign='center';g.fillStyle='rgba(0,0,0,.7)';const w=g.measureText(toast).width+28;g.fillRect(W/2-w/2,34,w,32);g.fillStyle='#ecdfb8';g.fillText(toast,W/2,56);g.textAlign='left'}
 if(intro>0){const a=Math.min(1,intro/1.2);g.globalAlpha=a;g.fillStyle='rgba(8,6,5,.92)';g.fillRect(0,206,W,124);g.fillStyle='#b89448';g.fillRect(0,206,W,4);g.fillRect(0,326,W,4);
  g.textAlign='center';g.fillStyle='#ecdfb8';g.font='bold 44px Georgia';g.fillText('O  OSSÁRIO',W/2,272);g.fillStyle='#b89448';g.font='bold 17px Georgia';g.fillText('SALA 1  ·  PRIMEIRO SELO',W/2,305);g.textAlign='left';g.globalAlpha=1}
}
function wrap(s,x,y,mw,lh){const ws=s.split(' ');let ln='';for(const w of ws){const tt=ln+w+' ';if(g.measureText(tt).width>mw){g.fillText(ln,x,y);ln=w+' ';y+=lh}else ln=tt}g.fillText(ln,x,y)}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);camStep(dt);
 g.save();g.fillStyle='#000';g.fillRect(0,0,W,H);
 {const c=C;g.setTransform(c.z,0,0,c.z,-c.x*c.z,-c.y*c.z)}
 drawWorld();g.restore();
 light();bloom();filmFx();
 // mistura com o quadro anterior durante a transição (motion blur barato, estilo película)
 if(C.bl>.04){g.save();g.globalAlpha=Math.min(.38,C.bl*.4);g.drawImage(prv,0,0);g.restore()}
 pg.drawImage(cv,0,0);
 ui();requestAnimationFrame(frame)}
function start(){hud();requestAnimationFrame(frame)}
